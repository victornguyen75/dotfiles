# ~/.tmux.conf
# Managed in ~/workspace/dotfiles/.tmux.conf, symlinked to ~/.tmux.conf

# --- True color support (required for Catppuccin theme + nvim to render correctly) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",wezterm:RGB"

# --- General quality of life ---
set -g mouse on
set -g history-limit 10000
set -g escape-time 10          # faster key sequence recognition (helps nvim <Esc>)
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# --- macOS clipboard integration ---
# Lets tmux copy-mode selections/yanks round-trip with the system clipboard, and
# with Neovim's `unnamedplus` register.
set -g set-clipboard on

# --- Prefix ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Pane splitting (keep working dir) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Kill line in shell (Ctrl-a Ctrl-k sends Ctrl-k to fish, bypassing vim-tmux-navigator) ---
bind C-k send-keys C-k

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Seamless pane/split navigation between tmux and Neovim (vim-tmux-navigator) ---
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Session persistence across reboots/restarts ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# --- Theme (Catppuccin Mocha, matching VSCode/WezTerm) ---
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# --- Plugin manager (tmux-plugins/tpm) — keep last ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
